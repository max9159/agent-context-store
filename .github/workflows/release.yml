name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - beta

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Bump version
        id: bump
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          export OLD=$(node -p "require('./package.json').version")
          NEW=$(node -e "
            const { execSync } = require('child_process');
            const old = process.env.OLD;
            const type = process.env.RELEASE_TYPE;
            const m = old.match(/^(\d+)\.(\d+)\.(\d+)(?:-beta\.(\d+))?\$/);
            if (!m) { throw new Error('Unparseable version: ' + old); }
            let [_, a, b, c, beta] = m;
            a = +a; b = +b; c = +c;
            let next;
            // Graduating from a prerelease: keep the same MAJOR.MINOR.PATCH,
            // just drop the -beta.N suffix. Otherwise bump as usual.
            if (type === 'major')      next = [a + 1, 0, 0].join('.');
            else if (type === 'minor') next = [a, b + 1, 0].join('.');
            else if (type === 'patch') next = beta !== undefined ? [a, b, c].join('.') : [a, b, c + 1].join('.');
            else if (type === 'beta') {
              // Continue the beta train from package.json and any previously pushed tags.
              const base = beta !== undefined ? [a, b, c].join('.') : [a, b, c + 1].join('.');
              const tagRe = new RegExp('^v' + base.replaceAll('.', '\\\\.') + '-beta\\\\.(\\\\d+)\\$');
              const tags = execSync('git tag --list v' + base + '-beta.*', { encoding: 'utf8' })
                .split('\\n')
                .map((tag) => tag.match(tagRe))
                .filter(Boolean)
                .map((match) => Number(match[1]));
              const currentBeta = beta !== undefined ? +beta : -1;
              const nextBeta = Math.max(currentBeta, -1, ...tags) + 1;
              next = base + '-beta.' + nextBeta;
            } else throw new Error('Unknown release_type: ' + type);
            console.log(next);
          ")

          DIST_TAG=latest
          [ "$RELEASE_TYPE" = beta ] && DIST_TAG=beta

          node -e "
            const fs = require('fs');
            const paths = [
              './package.json',
              './src/packages/core/package.json',
              './src/packages/cli/package.json'
            ];
            paths.forEach(p => {
              const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
              pkg.version = '$NEW';
              fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
            });
          "

          echo "version=$NEW" >> $GITHUB_OUTPUT
          echo "dist_tag=$DIST_TAG" >> $GITHUB_OUTPUT
          echo "Bumped $OLD → $NEW (dist-tag: $DIST_TAG)"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Authenticate with npm registry
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> ~/.npmrc

      - name: Dry run — core
        run: pnpm --filter "agent-context-store-core" publish --tag ${{ steps.bump.outputs.dist_tag }} --dry-run --no-git-checks

      - name: Dry run — cli
        run: pnpm --filter "agent-context-store" publish --tag ${{ steps.bump.outputs.dist_tag }} --dry-run --no-git-checks

      - name: Publish core
        run: pnpm --filter "agent-context-store-core" publish --tag ${{ steps.bump.outputs.dist_tag }} --no-git-checks

      - name: Publish cli
        run: pnpm --filter "agent-context-store" publish --tag ${{ steps.bump.outputs.dist_tag }} --no-git-checks

      - name: Verify registry
        run: |
          VERSION=${{ steps.bump.outputs.version }}
          echo "Checking agent-context-store-core@$VERSION"
          npm view agent-context-store-core version
          echo "Checking agent-context-store@$VERSION"
          npm view agent-context-store version

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit, tag, and push
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          VERSION=${{ steps.bump.outputs.version }}
          git add package.json src/packages/core/package.json src/packages/cli/package.json
          git commit -m "chore: release v$VERSION"
          git tag "v$VERSION"
          if [ "$RELEASE_TYPE" = "beta" ]; then
            # beta: tag only, do not move main forward
            git push origin "v$VERSION"
          else
            git push origin main --tags
          fi
